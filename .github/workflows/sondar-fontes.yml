name: Sondar fontes reais (diagnóstico)
on:
  push:
    branches: [claude/plataforma-inteligencia-comercial-ltse-22eyph]
    paths: [radar-lt-se/scripts/sonda/**, .github/workflows/sondar-fontes.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node radar-lt-se/scripts/sonda/sondar-fontes.mjs
